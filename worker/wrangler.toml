name = "classygem-api"
main = "src/index.ts"
compatibility_date = "2024-09-25"

[vars]
# Non-secret vars go here. Secrets (service role keys, FAL_KEY) are
# set with `wrangler secret put <NAME>` and must never be committed.

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "classygem-media"
# Wired for Phase 3+ (stills/upscales) and Phase 5 (video). No route
# reads or writes it yet in Phase 1.
